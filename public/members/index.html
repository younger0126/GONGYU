<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>工域會員中心</title><style>:root{font-family:Inter,"Noto Sans TC",system-ui,-apple-system,sans-serif;color:#eef4fb;background:#050b12}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#122033 0,#050b12 42%);min-height:100vh}.app{width:min(100%,560px);margin:auto;min-height:100vh;background:#08111b;padding:0 16px 28px}.top{height:62px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #1d2a38;position:sticky;top:0;background:#08111bf2;backdrop-filter:blur(16px);z-index:5}.top h1{font-size:19px;margin:0;flex:1}.iconbtn{width:38px;height:38px;border:1px solid #2a3a4d;background:#101d2b;color:#dce6f1;border-radius:11px}.tabs{display:flex;gap:8px;padding:14px 0}.tabs button{flex:1;border:1px solid #26394d;background:#0d1925;color:#899bad;border-radius:11px;padding:10px;font-weight:700}.tabs button.on{background:#17385f;color:#eaf3ff;border-color:#2d5f9b}.search{display:flex;gap:8px;background:#101c29;border:1px solid #203244;border-radius:12px;padding:11px 13px;margin-bottom:8px}.search input{width:100%;background:none;border:0;outline:none;color:#fff}.card{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid #1a2938}.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#607d9f,#203951);font-weight:800;border:2px solid #263b50;overflow:hidden;flex:0 0 auto}.avatar img{width:100%;height:100%;object-fit:cover}.grow{flex:1;min-width:0}.grow b{display:block}.grow small{display:block;color:#8191a4;margin-top:4px}.btn{border:1px solid #2a3a4d;background:#101d2b;color:#dce6f1;border-radius:10px;padding:9px 11px;font-weight:700}.btn.primary{background:#246fd8;border-color:#246fd8}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat{text-align:center;padding:12px;border:1px solid #24384d;border-radius:12px}.stat b,.stat small{display:block}.stat small{color:#8191a4;margin-top:4px}.row{display:flex;gap:8px}.row .btn{flex:1}.post{padding:12px 0;border-bottom:1px solid #1a2938}.post small{color:#7890aa}.muted{color:#718296;text-align:center;padding:26px 0}.modal{position:fixed;inset:0;background:#02070dd8;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.open{display:flex}.sheet{width:min(100%,500px);max-height:86vh;overflow:auto;background:#0d1a28;border:1px solid #263d56;border-radius:22px;padding:20px}.field{margin-top:12px}.field label{display:block;font-size:12px;color:#8293a6;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px;border-radius:10px;border:1px solid #294157;background:#08131e;color:#fff}.field textarea{min-height:90px}.close{float:right}.sectionTitle{font-size:13px;color:#7f91a5;margin:8px 0}.hint{font-size:12px;color:#6e8297;line-height:1.6;margin:10px 0}</style></head><body><div class="app"><div class="top"><button class="iconbtn" onclick="location.href='../'">←</button><h1>工域會員中心</h1></div><div class="tabs"><button id="tabMembers" class="on">找會員</button><button id="tabMine">我的資料</button></div><div id="membersView"><div class="search"><span>🔎</span><input id="search" placeholder="搜尋名稱、身份、地區、專長"></div><div id="list" class="muted">會員載入中…</div></div><div id="mineView" style="display:none"><div id="mine" class="muted">讀取會員資料中…</div></div></div><div id="modal" class="modal"><div class="sheet"><button id="close" class="btn close">關閉</button><div id="detail"></div></div></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const supabase=createClient('https://vvjwvneoifmodpxsprcc.supabase.co','sb_publishable_7ptXim1QKAg83FAFkyHNcA_yYW7eR2Z');const list=document.querySelector('#list'),search=document.querySelector('#search'),modal=document.querySelector('#modal'),detail=document.querySelector('#detail'),mineBox=document.querySelector('#mine');let members=[],me=null,following=new Set();const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function boot(){const{data:{user}}=await supabase.auth.getUser();me=user;const{data,error}=await supabase.from('profiles').select('*').order('display_name');if(error){list.textContent=error.message;return}members=data||[];if(me){const{data:f}=await supabase.from('follows').select('following_id').eq('follower_id',me.id);following=new Set((f||[]).map(x=>x.following_id))}render();renderMine()}function avatar(p){return`<div class="avatar">${p?.avatar_url?`<img src="${esc(p.avatar_url)}">`:esc((p?.display_name||'工').slice(0,1))}</div>`}function render(){const q=search.value.trim().toLowerCase(),rows=members.filter(p=>`${p.display_name||''} ${p.role||''} ${p.area||''} ${p.bio||''}`.toLowerCase().includes(q));list.className='';list.innerHTML=rows.map(p=>`<div class="card"><button data-open="${p.id}" style="display:flex;align-items:center;gap:11px;flex:1;border:0;background:none;color:inherit;text-align:left;padding:0">${avatar(p)}<div class="grow"><b>${esc(p.display_name||'會員')}</b><small>${esc(p.role||'工程會員')} · ${esc(p.area||'台灣')}</small></div></button>${me?.id!==p.id?`<button class="btn" data-follow="${p.id}">${following.has(p.id)?'已追蹤':'＋ 追蹤'}</button>`:''}</div>`).join('')||'<div class="muted">找不到會員</div>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openProfile(b.dataset.open));document.querySelectorAll('[data-follow]').forEach(b=>b.onclick=()=>toggleFollow(b.dataset.follow))}async function toggleFollow(id){if(!me){alert('請先回到工域登入會員');return}const active=following.has(id);const{error}=active?await supabase.from('follows').delete().eq('follower_id',me.id).eq('following_id',id):await supabase.from('follows').insert({follower_id:me.id,following_id:id});if(error){alert(error.message);return}active?following.delete(id):following.add(id);render();if(modal.classList.contains('open'))openProfile(id)}async function statsFor(id){const[{count:fc},{count:fg},{data:ps}]=await Promise.all([supabase.from('follows').select('*',{count:'exact',head:true}).eq('following_id',id),supabase.from('follows').select('*',{count:'exact',head:true}).eq('follower_id',id),supabase.from('posts').select('id,title,body,category,created_at').eq('author_id',id).order('created_at',{ascending:false})]);return{fc:fc||0,fg:fg||0,ps:ps||[]}}async function openProfile(id){const p=members.find(x=>x.id===id);if(!p)return;const{fc,fg,ps}=await statsFor(id);let saved=[];if(me?.id===id){const{data:b}=await supabase.from('bookmarks').select('posts(id,title,body,category,created_at)').eq('user_id',id);saved=(b||[]).map(x=>x.posts).filter(Boolean)}detail.innerHTML=`<div style="clear:both;padding-top:10px;display:flex;gap:13px;align-items:center">${avatar(p)}<div><h2 style="margin:0 0 5px">${esc(p.display_name||'會員')}</h2><div style="color:#8798aa">${esc(p.role||'工程會員')} · ${esc(p.area||'台灣')}</div></div></div><p style="line-height:1.65;color:#bdc9d6">${esc(p.bio||'尚未填寫個人簡介')}</p><div class="stats"><div class="stat"><b>${ps.length}</b><small>貼文</small></div><div class="stat"><b>${fc}</b><small>粉絲</small></div><div class="stat"><b>${fg}</b><small>追蹤</small></div></div><div class="row">${me?.id===id?`<button id="editBtn" class="btn primary">編輯個人資料</button><button id="savedBtn" class="btn">收藏 ${saved.length}</button>`:`<button id="followBtn" class="btn primary">${following.has(id)?'已追蹤（取消）':'＋ 追蹤'}</button>`}</div><div id="posts">${ps.map(x=>`<div class="post"><small>${esc(x.category||'')}</small><b style="display:block;margin-top:4px">${esc(x.title)}</b><p style="margin:5px 0;color:#bdc9d6">${esc(x.body||'')}</p></div>`).join('')||'<div class="muted">目前沒有貼文</div>'}</div>`;modal.classList.add('open');document.querySelector('#followBtn')?.addEventListener('click',()=>toggleFollow(id));document.querySelector('#editBtn')?.addEventListener('click',()=>editProfile(p));document.querySelector('#savedBtn')?.addEventListener('click',()=>{document.querySelector('#posts').innerHTML=saved.map(x=>`<div class="post"><small>${esc(x.category||'')}</small><b style="display:block;margin-top:4px">${esc(x.title)}</b><p style="margin:5px 0;color:#bdc9d6">${esc(x.body||'')}</p></div>`).join('')||'<div class="muted">目前沒有收藏</div>'})}async function renderMine(){if(!me){mineBox.innerHTML='<div class="muted">請先回到工域登入會員後，再查看自己的資料。</div>';return}const p=members.find(x=>x.id===me.id);if(!p){mineBox.textContent='找不到個人資料';return}const{fc,fg,ps}=await statsFor(me.id);mineBox.className='';mineBox.innerHTML=`<div style="display:flex;gap:13px;align-items:center;margin-top:8px">${avatar(p)}<div><h2 style="margin:0 0 5px">${esc(p.display_name||'會員')}</h2><div style="color:#8798aa">${esc(p.role||'工程會員')} · ${esc(p.area||'台灣')}</div></div></div><p style="line-height:1.65;color:#bdc9d6">${esc(p.bio||'尚未填寫個人簡介')}</p><div class="stats"><div class="stat"><b>${ps.length}</b><small>貼文</small></div><div class="stat"><b>${fc}</b><small>粉絲</small></div><div class="stat"><b>${fg}</b><small>追蹤</small></div></div><button id="mineEdit" class="btn primary" style="width:100%">編輯個人資料</button><div class="sectionTitle">我的貼文</div>${ps.map(x=>`<div class="post"><small>${esc(x.category||'')}</small><b style="display:block;margin-top:4px">${esc(x.title)}</b></div>`).join('')||'<div class="muted">目前沒有貼文</div>'}`;document.querySelector('#mineEdit').onclick=()=>{openProfile(me.id)}}function editProfile(p){detail.innerHTML=`<h2>編輯個人資料</h2><div class="field"><label>顯示名稱</label><input id="name" value="${esc(p.display_name||'')}"></div><div class="field"><label>身份</label><select id="role">${['師傅 / 工班','設計師','統包','材料商','屋主'].map(x=>`<option ${x===p.role?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>地區</label><input id="area" value="${esc(p.area||'')}"></div><div class="field"><label>個人簡介</label><textarea id="bio">${esc(p.bio||'')}</textarea></div><div class="field"><label>頭像（JPG / PNG / WEBP，5MB內）</label><input id="avatar" type="file" accept="image/jpeg,image/png,image/webp"></div><button id="save" class="btn primary" style="width:100%;margin-top:16px">儲存資料</button>`;document.querySelector('#save').onclick=async()=>{let avatar_url=p.avatar_url||null;const file=document.querySelector('#avatar').files[0];if(file){if(file.size>5*1024*1024){alert('頭像請小於 5MB');return}const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=`${me.id}/avatar-${Date.now()}.${ext}`;const{error}=await supabase.storage.from('avatars').upload(path,file,{upsert:true});if(error){alert(error.message);return}avatar_url=supabase.storage.from('avatars').getPublicUrl(path).data.publicUrl}const payload={display_name:document.querySelector('#name').value.trim(),role:document.querySelector('#role').value,area:document.querySelector('#area').value.trim(),bio:document.querySelector('#bio').value.trim(),avatar_url};const{error}=await supabase.from('profiles').update(payload).eq('id',me.id);if(error){alert(error.message);return}Object.assign(p,payload);render();await renderMine();await openProfile(p.id);alert('個人資料已更新')}}search.oninput=render;document.querySelector('#close').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};document.querySelector('#tabMembers').onclick=()=>{document.querySelector('#membersView').style.display='block';document.querySelector('#mineView').style.display='none';document.querySelector('#tabMembers').classList.add('on');document.querySelector('#tabMine').classList.remove('on')};document.querySelector('#tabMine').onclick=()=>{document.querySelector('#membersView').style.display='none';document.querySelector('#mineView').style.display='block';document.querySelector('#tabMine').classList.add('on');document.querySelector('#tabMembers').classList.remove('on');renderMine()};boot();</script></body></html>
